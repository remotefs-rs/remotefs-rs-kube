[package]
name = "remotefs-kube"
version = "1.0.0"
authors = ["Christian Visintin <christian.visintin1997@gmail.com>"]
categories = ["network-programming"]
documentation = "https://docs.rs/remotefs-kube"
edition = "2024"
include = ["src/**/*", "LICENSE", "README.md", "CHANGELOG.md"]
keywords = ["kube-client", "kube"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/remotefs-rs/remotefs-rs-kube"
rust-version = "1.89.0"
description = "remotefs implementation for kube"

[dependencies]
chrono = "0.4"
futures-io = "0.3"
k8s-openapi = { version = "0.28", features = ["v1_32"] }
kube = { version = "4", features = ["client", "config", "ws"] }
lazy-regex = "3"
log = "0.4"
remotefs = { version = "1", features = ["async"] }
tokio = { version = "1", features = ["io-util", "rt"] }

[dev-dependencies]
env_logger = "0.11"
futures = "0.3"
k8s-openapi = { version = "0.28", features = ["v1_32"] }
kube = { version = "4", features = ["client", "config", "runtime", "ws"] }
pretty_assertions = "1"
rand = "0.10"
serde_json = "1"
serial_test = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[features]
default = ["find"]
# misc
find = ["remotefs/find"]
no-log = ["log/max_level_off"]
tokio = ["remotefs/tokio"]
# tests
integration-tests = []

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
